<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kerf — Cut Design Studio</title>
<link rel="stylesheet" href="fonts/uifont.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand"><span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 20 L14 4 L17 6 L7 22 Z" fill="currentColor"/><path d="M15 3 l4 2.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span><b>Kerf</b><span class="sub">cut design studio</span></div>
    <nav class="menus" id="menus"></nav>
    <div class="tb-group">
      <button class="icon-btn" data-action="undo" title="Undo (Ctrl+Z)" id="btn-undo"></button>
      <button class="icon-btn" data-action="redo" title="Redo (Ctrl+Shift+Z)" id="btn-redo"></button>
    </div>
    <div class="tb-group zoom">
      <button class="icon-btn" data-action="zoomOut" title="Zoom out (Ctrl -)">−</button>
      <span id="zoom-label">100%</span>
      <button class="icon-btn" data-action="zoomIn" title="Zoom in (Ctrl +)">+</button>
      <button class="text-btn" data-action="zoomFit" title="Fit mat (Ctrl 0)">Fit</button>
    </div>
    <div class="spacer"></div>
    <label class="tb-select" title="Material sets the cut rules">
      <span>Material</span><select id="sel-material"></select>
    </label>
    <label class="tb-select" title="Mat size">
      <span>Mat</span><select id="sel-mat"></select>
    </label>
    <button class="status-pill" id="status-pill" data-action="showCheck" title="Cut check status">Checking…</button>
    <button class="primary" data-action="showExport">Export for Design Space</button>
  </header>

  <aside class="toolbar" id="toolbar"></aside>

  <main class="stage" id="stage">
    <canvas id="canvas"></canvas>
    <div class="tool-options" id="tool-options"></div>
    <div class="drop-hint" id="drop-hint">Drop images, SVGs, fonts or .kerf projects</div>
    <footer class="statusbar"><span id="st-cursor">x 0.00" y 0.00"</span><span id="st-sel"></span><span class="grow"></span><span id="st-tip">Tip: drop an image here, then remove its background and trace it.</span></footer>
  </main>

  <aside class="sidebar">
    <div class="tabs" role="tablist" id="tabs">
      <button role="tab" data-tab="design" class="active">Design</button>
      <button role="tab" data-tab="layers">Layers</button>
      <button role="tab" data-tab="check">Cut check <span class="badge" id="tab-badge"></span></button>
      <button role="tab" data-tab="export">Export</button>
    </div>
    <div class="panel" data-panel="design" id="panel-design"></div>
    <div class="panel" data-panel="layers" id="panel-layers" hidden></div>
    <div class="panel" data-panel="check" id="panel-check" hidden></div>
    <div class="panel" data-panel="export" id="panel-export" hidden></div>
  </aside>
</div>

<div id="toasts" aria-live="polite"></div>
<div id="modal" class="modal" hidden><div class="modal-card" id="modal-card"></div></div>
<input type="file" id="file-import" accept="image/*,.svg,.ttf,.otf,.woff,.kerf" multiple hidden>
<input type="file" id="file-open" accept=".kerf,.json" hidden>
<input type="file" id="file-font" accept=".ttf,.otf,.woff" multiple hidden>

<script src="vendor/paper-full.min.js"></script>
<script src="vendor/opentype.min.js"></script>
<script src="vendor/paperjs-offset.min.js"></script>
<script src="fonts/fonts.js"></script>
<script src="js/core/util.js"></script>
<script src="js/core/materials.js"></script>
<script src="js/core/mask.js"></script>
<script src="js/core/imageops.js"></script>
<script src="js/core/trace.js"></script>
<script src="js/core/geom.js"></script>
<script src="js/core/text.js"></script>
<script src="js/core/cutcheck.js"></script>
<script src="js/core/exporter.js"></script>
<script src="js/core/distress.js"></script>
<script src="js/core/weed.js"></script>
<script src="js/core/nest.js"></script>
<script src="js/app/history.js"></script>
<script src="js/app/app.js"></script>
<script src="js/app/tools.js"></script>
<script src="js/app/store.js"></script>
<script src="js/app/vinyl.js"></script>
<script src="js/app/ui.js"></script>
<script src="js/app/main.js"></script>
<script src="js/app/selftest.js"></script>
</body>
</html>
